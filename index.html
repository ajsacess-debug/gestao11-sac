function previewPhoto(input){const f=input.files[0];if(!f)return;if(f.size>2*1024*1024){input.value='';return showSettingsMessage('A foto deve ter no máximo 2 MB.','error')}const reader=new FileReader();reader.onload=()=>{const img=new Image();img.onload=()=>{const size=180,c=document.createElement('canvas');c.width=c.height=size;const ctx=c.getContext('2d'),side=Math.min(img.width,img.height),sx=(img.width-side)/2,sy=(img.height-side)/2;ctx.drawImage(img,sx,sy,side,side,0,0,size,size);pendingAvatar=c.toDataURL('image/jpeg',.82);const p=document.getElementById('photoPreview');p.style.backgroundImage='url("'+pendingAvatar+'")';p.textContent=''};img.src=reader.result};reader.readAsDataURL(f)}

function saveEvidence(id,input){const file=input.files&&input.files[0];if(!file)return;if(file.size>1024*1024)return toast('A evidência deve ter até 1 MB');const allowed=['image/png','image/jpeg','image/webp','application/pdf'];if(!allowed.includes(file.type))return toast('Use PDF, PNG, JPG ou WebP');const reader=new FileReader();reader.onload=()=>{const a=activities.find(x=>x.id===id);a.attachments=a.attachments||[];a.attachments.push({id:Date.now(),name:file.name,type:file.type,size:file.size,data:reader.result,authorName:current.name,authorUsername:current.username,createdAt:'Agora'});a.updated='Agora';try{persistActivities();toast('Evidência anexada com sucesso');render()}catch(e){a.attachments.pop();toast('Não foi possível salvar. Use um arquivo menor.')}};reader.readAsDataURL(file)}
function card(a){const visibleNotes=allowedObservations(a),canAttach=current.role==='manager'||a.coord===current.name||a.owner===current.name,canDelete=current.role==='manager';return '<article class="card activity"><div class="tags"><span class="tag '+tagClass(a.status)+'">'+a.status+'</span>'+(a.late&&a.status!=='Concluído'?'<span class="tag late">⚠ Atrasada</span>':'')+'</div><h3>'+esc(a.title)+'</h3><div class="meta"><span>Responsável<b>'+a.owner+'</b></span><span>Prioridade<b>'+a.priority+'</b></span><span>Prazo<b>'+a.due+'</b></span><span>Atualização<b>'+a.updated+'</b></span></div><div class="cardactions">'+(a.status!=='Concluído'?'<button class="btn dark small" onclick="complete('+a.id+')">✓ Concluir</button>':'<button class="btn outline small" onclick="reopen('+a.id+')">Reabrir</button>')+'<select class="statusSelect" onchange="updateStatus('+a.id+',this.value)"><option '+sel(a,'Novo')+'>Novo</option><option '+sel(a,'Em andamento')+'>Em andamento</option><option '+sel(a,'Aguardando Erika')+'>Aguardando Erika</option><option '+sel(a,'Aguardando coordenador')+'>Aguardando coordenador</option><option '+sel(a,'Aguardando outra área')+'>Aguardando outra área</option><option '+sel(a,'Impedido')+'>Impedido</option><option '+sel(a,'Pessoas e Desenvolvimento')+'>Pessoas e Desenvolvimento</option><option '+sel(a,'Concluído')+'>Concluído</option></select><button class="navbtn" onclick="toggleObservations('+a.id+')">💬 '+visibleNotes.length+' observações</button>'+(canDelete?'<button class="navbtn" style="color:var(--red)" onclick="deleteActivity('+a.id+')">🗑 Excluir</button>':'')+(canAttach?'<label class="navbtn" for="directEvidence'+a.id+'">📎 Anexar evidência</label><input class="hidden" id="directEvidence'+a.id+'" type="file" accept=".pdf,.png,.jpg,.jpeg,.webp,application/pdf,image/*" onchange="saveEvidence('+a.id+',this)">':'')+'</div>'+observationPanel(a)+'</article>'}
function sel(a,s){return a.status===s?'selected':''}function updateStatus(id,status){const a=activities.find(x=>x.id===id);a.status=status;a.updated='Agora';if(status==='Concluído')a.late=false;persistActivities();toast('Atividade atualizada');render()}function complete(id){updateStatus(id,'Concluído')}function reopen(id){updateStatus(id,'Em andamento')}function deleteActivity(id){if(current.role!=='manager')return toast('Somente gerente ou ADM pode excluir atividades');const a=activities.find(x=>x.id===id);if(!a||!confirm('Deseja realmente excluir a atividade “'+a.title+'”? Esta ação não poderá ser desfeita.'))return;activities=activities.filter(x=>x.id!==id);Object.keys(agendaDrafts).forEach(name=>agendaDrafts[name]=(agendaDrafts[name]||[]).map(group=>group.filter(item=>item.activityId!==id)));sessionStorage.setItem('g11_agenda_drafts',JSON.stringify(agendaDrafts));persistActivities();if(observationActivityId===id)observationActivityId=null;toast('Atividade excluída');render()}function toggleObservations(id){observationActivityId=observationActivityId===id?null:id;render()}function saveObservation(id){const a=activities.find(x=>x.id===id),field=document.getElementById('observationText'+id),txt=field.value.trim();if(!txt)return toast('Escreva a observação antes de registrar');a.observations.push({id:Date.now(),authorUsername:current.username,authorName:current.name,text:txt,createdAt:'Agora'});a.comments=a.observations.length;a.updated='Agora';persistActivities();toast('Observação registrada');render()}

function managerHome(){const open=activities.filter(a=>a.status!=='Concluído'),greeting=current.username==='adm'?'Adm':current.name.split(' ')[0];return '<div class="top"><div><div class="muted"><b>Terça-feira, 1 de setembro</b></div><h1>Bom dia, '+esc(greeting)+'!</h1><div class="muted">Acompanhe sua equipe e prepare os próximos encontros.</div></div></div>'+quick('')+'<div class="grid stats">'+stat('Em aberto',open.length)+stat('Atrasadas',open.filter(a=>a.late).length)+stat('Aguardando você',open.filter(a=>a.owner==='Erika').length)+stat('Concluídas',activities.filter(a=>a.status==='Concluído').length)+'</div><div class="sectionhead"><div><h2>Coordenadores</h2><div class="muted">Uma visão rápida de cada espaço</div></div></div><div class="grid people">'+users.filter(u=>u.role==='coordinator').map(u=>{const m=open.filter(a=>a.coord===u.name);return '<article class="card person"><div class="circle">'+u.name[0]+'</div><h3>'+u.name+'</h3><div class="muted" style="font-size:12px">Próximo 1:1 • '+u.next+'</div><div class="counts"><p><b>'+m.length+'</b>abertas</p><p><b style="color:var(--red)">'+m.filter(a=>a.late).length+'</b>atrasadas</p></div><div class="actions"><button class="btn dark small" onclick="openSpace(\''+u.name+'\')">Abrir espaço</button><button class="btn outline small" onclick="openAgenda(\''+u.name+'\')">Preparar 1:1</button></div></article>'}).join('')+'</div>'}
function coordHome(u){const mine=activities.filter(a=>a.coord===u.name),active=mine.filter(a=>a.status!=='Concluído'),completed=mine.filter(a=>a.status==='Concluído');return (space?'<button class="back" onclick="space=null;render()">← Voltar ao painel</button>':'')+'<div class="top"><div><div class="muted"><b>Próximo 1:1 • '+u.next+'</b></div><h1>Olá, '+u.name+'!</h1><div class="muted">Aqui estão os assuntos e atividades para acompanharmos juntos.</div></div><button class="btn dark" onclick="openAgenda(\''+u.name+'\')">✦ Preparar meu 1:1</button></div>'+(space?'':quick(u.name))+'<div class="grid stats">'+stat('Em aberto',active.length)+stat('Atrasadas',active.filter(a=>a.late).length)+stat('Aguardando Erika',active.filter(a=>a.status==='Aguardando Erika').length)+stat('Concluídas',completed.length)+'</div><div class="sectionhead"><h2>Atividades em destaque</h2><span class="muted">'+active.length+' itens</span></div><div class="grid activities">'+(active.length?active.map(card).join(''):'<div class="card muted">Nenhuma atividade em aberto.</div>')+'</div>'+(space?'<div class="sectionhead"><div><h2>Histórico de atividades concluídas</h2><div class="muted">Consulte todas as entregas finalizadas deste espaço.</div></div><span class="muted">'+completed.length+' itens</span></div><div class="grid activities">'+(completed.length?completed.map(card).join(''):'<div class="card muted">Nenhuma atividade concluída até o momento.</div>')+'</div>':'')}
function activityView(){const statuses=['Todos','Novo','Em andamento','Aguardando Erika','Aguardando coordenador','Aguardando outra área','Impedido','Pessoas e Desenvolvimento','Concluído'];return '<div class="top"><div><h1>Atividades</h1><div class="muted">Acompanhe e atualize em poucos cliques.</div></div><div style="display:flex;gap:9px;flex-wrap:wrap"><input class="field search" id="search" placeholder="Pesquisar atividade" oninput="filterCards()"><select class="field" id="statusFilter" style="width:auto;min-width:190px" onchange="activityStatus=this.value;filterCards()">'+statuses.map(s=>'<option '+(activityStatus===s?'selected':'')+'>'+s+'</option>').join('')+'</select></div></div><div id="activityGrid" class="grid activities" style="margin-top:18px">'+filteredActivities('').map(card).join('')+'</div>'}
function filteredActivities(q){return visible().filter(a=>(activityStatus==='Todos'||a.status===activityStatus)&&a.title.toLowerCase().includes((q||'').toLowerCase()))}function filterCards(){const field=document.getElementById('search'),data=filteredActivities(field?field.value:'');document.getElementById('activityGrid').innerHTML=data.map(card).join('')||'<div class="card muted">Nenhuma atividade encontrada com estes filtros.</div>'}
function meetings(){const list=current.role==='manager'?users.filter(u=>u.role==='coordinator'):[current];return '<h1>Próximas reuniões</h1><p class="muted">Prepare a pauta automaticamente.</p><div class="grid activities">'+list.map(u=>'<button class="card" style="text-align:left" onclick="openAgenda(\''+u.name+'\')"><b>'+u.name+'</b><span class="muted" style="display:block">'+u.next+'</span><span style="float:right;color:var(--orange)">✦ Preparar pauta</span></button>').join('')+'</div>'}
const agendaGroups=['Atividades atrasadas','Riscos e impedimentos','Itens aguardando atuação','Desenvolvimento'];
const agendaSpecific=['Motivo do atraso / novo prazo','Impacto / ação de mitigação','Aguardando quem / previsão de retorno','Tipo de conversa / ação de desenvolvimento'];
function agendaGroupForActivity(a){if(a.late&&a.status!=='Concluído')return 0;if(a.status==='Aguardando outra área'||a.status==='Impedido')return 1;if(/^Aguardando /.test(a.status))return 2;if(a.status==='Pessoas e Desenvolvimento'||/pessoa|equipe|desenvolvimento|feedback|treinamento|capacita|desempenho/i.test((a.category||'')+' '+a.title))return 3;return -1}
function newAgendaItem(title='',source='Manual',owner=agendaName){return{id:Date.now()+Math.random(),title,details:'',owner,due:'',priority:'Média',status:'Para discutir',next:'',source,visibility:'Compartilhado',specific:'',createdBy:current?.username||''}}
function agendaDraft(){if(!agendaDrafts[agendaName])agendaDrafts[agendaName]=agendaGroups.map(()=>[]);if(agendaDrafts[agendaName].length===5){const old=agendaDrafts[agendaName];agendaDrafts[agendaName]=[old[0]||[],old[2]||[],[...(old[3]||[]),...(old[1]||[])],old[4]||[]]}const groups=agendaDrafts[agendaName],linked=[];groups.forEach((g,i)=>{linked.push(...g.filter(x=>x.activityId));groups[i]=g.filter(x=>!x.activityId)});activities.filter(a=>a.coord===agendaName&&a.status!=='Concluído').forEach(a=>{const groupIndex=agendaGroupForActivity(a);if(groupIndex<0)return;const item=linked.find(x=>x.activityId===a.id)||{...newAgendaItem(a.title,'Atividade existente',a.owner),activityId:a.id};item.title=a.title;item.owner=a.owner;item.due=a.dueISO||item.due||'';item.priority=a.priority;item.status=a.status;item.specific='Prazo atual: '+a.due;groups[groupIndex].push(item)});return groups}
function agendaItemOptions(values,selected){return values.map(v=>'<option '+(v===selected?'selected':'')+'>'+esc(v)+'</option>').join('')}
function agendaItemCard(item,groupIndex,itemIndex){const owners=[agendaName,'Erika Araujo'],summary=item.title||'Novo item sem título',linked=item.activityId?activities.find(a=>a.id===item.activityId):null,canAttach=linked&&(current.role==='manager'||linked.coord===current.name||linked.owner===current.name);return '<details class="agendaItem" '+(!item.title||item.source==='Transcrição'?'open':'')+' style="display:block"><summary style="cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:12px;align-items:center"><span><b>'+esc(summary)+'</b><small class="muted" style="display:block">'+esc(item.owner||'Sem responsável')+' • '+esc(item.status)+'</small></span><span class="tag new">'+esc(item.source)+'</span></summary><div style="margin-top:14px"><label style="font-weight:700">Assunto</label><input class="field" value="'+esc(item.title)+'" oninput="updateAgendaItem('+groupIndex+','+itemIndex+',\'title\',this.value)" placeholder="Resumo objetivo do assunto"><label style="display:block;font-weight:700;margin-top:10px">Contexto e informações importantes</label><textarea style="min-height:74px" oninput="updateAgendaItem('+groupIndex+','+itemIndex+',\'details\',this.value)" placeholder="Registre somente o contexto necessário...">'+esc(item.details)+'</textarea><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:10px"><label>Responsável<select class="field" onchange="updateAgendaItem('+groupIndex+','+itemIndex+',\'owner\',this.value)">'+agendaItemOptions(owners,item.owner)+'</select></label><label>Prazo<input class="field" type="date" value="'+esc(item.due)+'" onchange="updateAgendaItem('+groupIndex+','+itemIndex+',\'due\',this.value)"></label><label>Prioridade<select class="field" onchange="updateAgendaItem('+groupIndex+','+itemIndex+',\'priority\',this.value)">'+agendaItemOptions(['Baixa','Média','Alta','Urgente'],item.priority)+'</select></label><label>Status<select class="field" onchange="updateAgendaItem('+groupIndex+','+itemIndex+',\'status\',this.value)">'+agendaItemOptions(['Novo','Em andamento','Aguardando Erika','Aguardando coordenador','Aguardando outra área','Impedido','Pessoas e Desenvolvimento','Concluído'],item.status)+'</select></label></div><label style="display:block;font-weight:700;margin-top:10px">'+agendaSpecific[groupIndex]+'</label><input class="field" value="'+esc(item.specific)+'" oninput="updateAgendaItem('+groupIndex+','+itemIndex+',\'specific\',this.value)" placeholder="Informação específica desta seção"><label style="display:block;font-weight:700;margin-top:10px">Encaminhamento / próximo passo</label><textarea style="min-height:64px" oninput="updateAgendaItem('+groupIndex+','+itemIndex+',\'next\',this.value)" placeholder="O que deve acontecer depois?">'+esc(item.next)+'</textarea><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px"><label>Origem<input class="field" value="'+esc(item.source)+'" disabled></label><label>Visibilidade<select class="field" onchange="updateAgendaItem('+groupIndex+','+itemIndex+',\'visibility\',this.value)">'+agendaItemOptions(['Compartilhado','Particular'],item.visibility)+'</select></label></div><button class="btn outline small noPrint" style="margin-top:12px;color:var(--red);border-color:var(--red)" onclick="removeAgendaItem('+groupIndex+','+itemIndex+')">Excluir item</button>'+(linked?'<button class="btn outline small noPrint" style="margin:12px 0 0 8px" onclick="toggleObservations('+linked.id+')">💬 Comentários e evidências</button>':'')+(canAttach?'<label class="btn outline small noPrint" style="margin:12px 0 0 8px" for="agendaEvidence'+linked.id+'">📎 Anexar evidência</label><input class="hidden" id="agendaEvidence'+linked.id+'" type="file" accept=".pdf,.png,.jpg,.jpeg,.webp,application/pdf,image/*" onchange="saveEvidence('+linked.id+',this)">':'')+(linked?observationPanel(linked):'')+'</div></details>'}
function agenda(){const draft=agendaDraft(),total=draft.reduce((n,g)=>n+g.length,0);return '<button class="back noPrint" onclick="agendaName=\'\';view=\'home\';render()">← Voltar</button><div class="agendahead"><div class="eyebrow">Pauta padronizada</div><h1>1:1 • Erika e '+agendaName+'</h1><p style="opacity:.7">'+total+' itens em preparação • revise antes de salvar</p><button class="btn small noPrint" onclick="saveAgendaDraft()">Salvar pauta</button> <button class="btn outline small noPrint" onclick="copyAgenda()">Copiar pauta</button> <button class="btn outline small noPrint" onclick="print()">Imprimir / PDF</button></div><section class="card agendaGroup noPrint" style="border-color:#C9DAEF;background:#F8FBFF"><h2>Importar transcrição ou ata</h2><p class="muted">O conteúdo importado gera rascunhos. Revise responsável, prazo, categoria e visibilidade antes de salvar.</p><textarea id="meetingTranscript" placeholder="Cole aqui a transcrição ou a ata da reunião..."></textarea><div class="settingsActions"><button class="btn small" onclick="analyzeTranscript()">Gerar rascunhos</button><label class="btn outline small" for="transcriptFile">Carregar TXT</label><input class="hidden" id="transcriptFile" type="file" accept=".txt,.md,text/plain" onchange="loadTranscriptFile(this)"><button class="btn outline small" onclick="clearAgendaDraft()">Limpar pauta</button></div></section>'+agendaGroups.map((g,i)=>'<section class="card agendaGroup"><div style="display:flex;justify-content:space-between;align-items:center;gap:12px"><div><h2>'+g+'</h2><span class="muted" style="font-size:12px">'+draft[i].length+' itens</span></div>'+'<span class="muted" style="font-size:12px">Atualização automática</span>'+'</div><div style="display:grid;gap:10px;margin-top:12px">'+(draft[i].length?draft[i].map((item,n)=>agendaItemCard(item,i,n)).join(''):'<div class="muted" style="padding:10px 0">Nenhum item nesta seção.</div>')+'</div></section>').join('')}
function updateAgendaItem(groupIndex,itemIndex,field,value){agendaDraft()[groupIndex][itemIndex][field]=value}
function addAgendaItem(groupIndex){if(groupIndex===0)return;agendaDraft()[groupIndex].push(newAgendaItem());render()}
function removeAgendaItem(groupIndex,itemIndex){agendaDraft()[groupIndex].splice(itemIndex,1);render();toast('Item removido da pauta')}
function clearAgendaDraft(){agendaDrafts[agendaName]=agendaGroups.map(()=>[]);render();toast('Pauta limpa')}
function saveAgendaDraft(){sessionStorage.setItem('g11_agenda_drafts',JSON.stringify(agendaDrafts));toast('Pauta salva nesta sessão')}
function loadTranscriptFile(input){const file=input.files&&input.files[0];if(!file)return;if(file.size>2*1024*1024)return toast('O arquivo deve ter até 2 MB');const reader=new FileReader();reader.onload=()=>{document.getElementById('meetingTranscript').value=reader.result;toast('Arquivo carregado. Clique em Gerar rascunhos')};reader.readAsText(file,'UTF-8')}
function analyzeTranscript(){const field=document.getElementById('meetingTranscript'),text=field.value.trim();if(!text)return toast('Cole ou carregue uma transcrição primeiro');const parts=text.split(/(?:\r?\n|(?<=[.!?;])\s+)/).map(s=>s.trim()).filter(s=>s.length>8),draft=agendaDraft();parts.forEach(sentence=>{const s=sentence.toLowerCase();let i=2;if(/risco|imped|bloque|problema|dificuldade|ameaça/.test(s))i=1;else if(/equipe|pessoa|colaborador|feedback|desenvolvimento|treinamento|capacita|desempenho/.test(s))i=3;const item=newAgendaItem(sentence,'Transcrição',agendaName);item.priority=i===1?'Alta':'Média';item.status='Novo';draft[i].push(item)});render();toast(parts.length+' rascunhos gerados. Revise antes de salvar')}
function copyAgenda(){const draft=agendaDraft(),sections=agendaGroups.map((g,i)=>{const items=draft[i].map(item=>['• '+item.title,'Responsável: '+item.owner,'Prazo: '+(item.due||'A definir'),'Prioridade: '+item.priority,'Status: '+item.status,item.specific?agendaSpecific[i]+': '+item.specific:'',item.next?'Próximo passo: '+item.next:''].filter(Boolean).join(' | '));return items.length?g+'\n'+items.join('\n'):''}).filter(Boolean);const text='Pauta 1:1 — Erika e '+agendaName+'\n\n'+sections.join('\n\n');navigator.clipboard?navigator.clipboard.writeText(text).then(()=>toast('Pauta copiada')):toast('Use Imprimir / PDF')}
function historyView(){return '<h1>Histórico</h1><p class="muted">Reuniões, decisões e alterações recentes.</p><div class="card" style="margin-top:18px">'+visible().slice(0,7).map((a,i)=>'<div class="historyItem"><span class="circle">✓</span><div><b>'+a.updated+'</b><div class="muted">'+esc(a.title)+' — '+(i%2?'comentário adicionado':'status atualizado para '+a.status)+'</div></div></div>').join('')+'</div>'}
function refreshUsers(){loadProfiles().then(()=>{render();toast('Lista atualizada diretamente do Supabase')}).catch(e=>toast(e.message))}
async function deleteManagedUser(id,name){if(!confirm('Excluir o acesso de “'+name+'”? O login será bloqueado, mas as atividades e o histórico serão preservados.'))return;try{const res=await fetch(SUPABASE_URL+'/rest/v1/rpc/deactivate_managed_user',{method:'POST',headers:authHeaders(currentSession.access_token),body:JSON.stringify({target_id:id})}),data=await res.json().catch(()=>({}));if(!res.ok)throw new Error(data.message||'Não foi possível excluir o acesso.');await loadProfiles();render();toast('Acesso excluído com segurança')}catch(e){toast(e.message)}}
function usersView(){const accessUsers=(current.authRole==='admin'?[{name:'Adm',username:'adm',role:'admin'},...users]:users),cards=accessUsers.map(u=>{const email=loginDirectory[u.username]||'E-mail cadastrado',role=u.role==='admin'?'Administrador':u.role==='manager'?'Gerente':'Coordenador(a)',canDelete=!!u.id&&u.id!==currentSession?.user?.id&&(current.authRole==='admin'||(current.authRole==='manager'&&u.role==='coordinator'));return '<article class="card" tabindex="0" role="button" aria-label="Editar dados de '+esc(u.name)+'" style="cursor:pointer;transition:.18s" onclick="openUserEditor(\''+esc(u.username)+'\')" onkeydown="if(event.key===\'Enter\'){openUserEditor(\''+esc(u.username)+'\')}"><div style="display:flex;align-items:center;gap:12px"><div class="circle" style="width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:#E8F1FC;color:#0054B8;font-weight:750">'+esc(u.name[0])+'</div><div><h3 style="margin:0;color:#0054B8">'+esc(u.name)+'</h3><div class="muted" style="font-size:12px">'+esc(role)+'</div></div></div><div style="margin-top:14px;font-size:13px"><b>Usuário</b><div class="muted">'+esc(u.username)+'</div><b style="display:block;margin-top:8px">E-mail</b><div class="muted">'+esc(email)+'</div></div><span class="tag done" style="display:inline-block;margin-top:14px">Acesso ativo</span><div style="display:flex;justify-content:space-between;margin-top:14px;color:#0054B8;font-size:12px;font-weight:700"><span>Editar dados do usuário</span><span>→</span></div>'+(canDelete?'<button class="btn outline small" style="margin-top:12px;color:var(--red);border-color:var(--red)" onclick="event.stopPropagation();deleteManagedUser(\''+u.id+'\',\''+esc(u.name)+'\')">🗑 Excluir acesso</button>':'')+'</article>'}).join('');return '<div class="top"><div><h1>Usuários</h1><div class="muted">Clique em um acesso para visualizar ou alterar os dados.</div></div><button class="btn outline small" onclick="refreshUsers()">↻ Atualizar lista</button></div><div class="sectionhead"><div><h2>Acessos cadastrados</h2><div class="muted">ADM, Gerência e Coordenação</div></div></div><div class="grid activities">'+cards+'</div><div class="sectionhead"><div><h2>Criar novo usuário</h2><div class="muted">Defina uma senha provisória para o primeiro acesso.</div></div></div><div class="card settingsForm" style="max-width:720px"><label>Nome completo</label><input class="field" id="newUserName" autocomplete="name"><label>E-mail</label><input class="field" id="newUserEmail" type="email" autocomplete="email"><label>Senha provisória</label><input class="field" id="newUserPassword" type="password" autocomplete="new-password">'+passwordHint+'<label>Repita a senha provisória</label><input class="field" id="newUserPassword2" type="password" autocomplete="new-password"><div id="newUserMessage"></div><div class="settingsActions"><button class="btn" id="createUserButton" onclick="createManagedUser()">Criar usuário</button></div></div>'}
function openUserEditor(username){if(current.role!=='manager')return;editedUsername=username;view='userEdit';render()}
function userEditView(){const u=editedUsername==='adm'?{name:'Adm',username:'adm',role:'admin'}:users.find(x=>x.username===editedUsername);if(!u)return usersView();const email=loginDirectory[u.username]||'',locked=u.role==='admin',roleLocked=current.authRole!=='admin',passwordAction=current.role==='manager'?'<div style="margin-top:22px;padding-top:20px;border-top:1px solid var(--border)"><label>Alterar senha</label><div class="settingsHint">Envie um código seguro para que '+esc(u.name)+' defina uma nova senha. O código será encaminhado para '+esc(email)+'.</div><input id="resetUserEmail" type="hidden" value="'+esc(email)+'"><div id="managedResetMessage"></div><div class="settingsActions"><button class="btn outline" id="managedResetButton" onclick="sendManagedPasswordReset()">Enviar código de alteração</button></div></div>':'';return '<button class="back" onclick="setView(\'users\')">← Voltar para usuários</button><div class="top"><div><h1>Editar usuário</h1><div class="muted">Atualize os dados de '+esc(u.name)+'.</div></div></div><div class="card settingsForm" style="max-width:720px;margin-top:22px"><label>Nome completo</label><input class="field" id="editUserName" value="'+esc(u.name)+'" '+(locked?'disabled':'')+'><label>Usuário</label><input class="field" id="editUsername" value="'+esc(u.username)+'" '+(locked?'disabled':'')+'><label>E-mail de acesso</label><input class="field" type="email" value="'+esc(email)+'" disabled><div class="settingsHint">A alteração do e-mail de autenticação exige confirmação administrativa no Supabase.</div><label>Cargo / nível de acesso</label><select class="field" id="editUserRole" '+(locked||roleLocked?'disabled':'')+'><option value="coordinator" '+(u.role==='coordinator'?'selected':'')+'>Coordenador(a)</option><option value="manager" '+(u.role==='manager'?'selected':'')+'>Gerente</option></select>'+(roleLocked?'<div class="settingsHint">Somente o ADM pode alterar o nível de acesso.</div>':'')+passwordAction+'<div id="editUserMessage"></div><div class="settingsActions"><button class="btn" id="saveUserButton" onclick="saveManagedUser()" '+(locked?'disabled':'')+'>Salvar alterações</button><button class="btn outline" onclick="setView(\'users\')">Cancelar</button></div></div>'}
function showEditUserMessage(text,type){document.getElementById('editUserMessage').innerHTML=authMessage(text,type)}
async function saveManagedUser(){if(current.role!=='manager'||editedUsername==='adm')return;const original=users.find(u=>u.username===editedUsername),name=document.getElementById('editUserName').value.trim(),username=document.getElementById('editUsername').value.trim().toLowerCase(),role=current.authRole==='admin'?document.getElementById('editUserRole').value:original.role;if(!original||!name||!username)return showEditUserMessage('Preencha nome e usuário.','error');if(!/^[a-z0-9._-]+$/.test(username))return showEditUserMessage('Use letras minúsculas, números, ponto, hífen ou sublinhado.','error');if(username!==editedUsername&&loginDirectory[username])return showEditUserMessage('Este usuário já está em uso.','error');const btn=document.getElementById('saveUserButton');btn.disabled=true;btn.textContent='Salvando...';try{const res=await fetch(SUPABASE_URL+'/rest/v1/profiles?username=eq.'+encodeURIComponent(editedUsername),{method:'PATCH',headers:{...authHeaders(currentSession.access_token),'Prefer':'return=representation'},body:JSON.stringify({name,username,role})}),data=await res.json().catch(()=>[]);if(!res.ok)throw new Error(data.message||'Não foi possível salvar.');const email=loginDirectory[editedUsername];if(username!==editedUsername){delete loginDirectory[editedUsername];loginDirectory[username]=email}original.name=name;original.username=username;original.role=role;editedUsername=username;showEditUserMessage('Dados atualizados com sucesso.','ok');setTimeout(()=>setView('users'),700)}catch(e){showEditUserMessage(e.message,'error')}finally{btn.disabled=false;btn.textContent='Salvar alterações'}}

function showManagedResetMessage(text,type){document.getElementById('managedResetMessage').innerHTML=authMessage(text,type)}
async function sendManagedPasswordReset(){if(current.role!=='manager')return;const email=document.getElementById('resetUserEmail').value.trim().toLowerCase();if(!email)return showManagedResetMessage('Este usuário não possui um e-mail de acesso cadastrado.','error');const btn=document.getElementById('managedResetButton');btn.disabled=true;btn.textContent='Enviando...';try{const res=await fetch(SUPABASE_URL+'/auth/v1/recover',{method:'POST',headers:authHeaders(),body:JSON.stringify({email})}),data=await res.json().catch(()=>({}));if(!res.ok)throw new Error(data.msg||data.message||'Não foi possível enviar o código agora.');showManagedResetMessage('Código de alteração enviado para '+email+'.','ok')}catch(e){showManagedResetMessage(e.message==='email rate limit exceeded'?'O limite temporário de e-mails foi atingido. Aguarde alguns minutos e tente novamente.':e.message,'error')}finally{btn.disabled=false;btn.textContent='Enviar código de alteração'}}
async function createManagedUser(){if(current.role!=='manager')return;const name=document.getElementById('newUserName').value.trim(),email=document.getElementById('newUserEmail').value.trim().toLowerCase(),password=document.getElementById('newUserPassword').value,p2=document.getElementById('newUserPassword2').value,policy=passwordError(password);if(!name||!email||!password||!p2)return showNewUserMessage('Preencha todos os campos.','error');if(password!==p2)return showNewUserMessage('As senhas não coincidem.','error');if(policy)return showNewUserMessage(policy,'error');const btn=document.getElementById('createUserButton');btn.disabled=true;btn.textContent='Criando...';try{const username=email.split('@')[0],redirect=location.origin+location.pathname;const res=await fetch(SUPABASE_URL+'/auth/v1/signup?redirect_to='+encodeURIComponent(redirect),{method:'POST',headers:authHeaders(),body:JSON.stringify({email,password,data:{name,username,role:'coordinator',must_change_password:true}})}),data=await res.json();if(!res.ok)throw new Error(data.msg||data.message||'Não foi possível criar o usuário.');if(data.user?.id)await fetch(SUPABASE_URL+'/rest/v1/profiles?id=eq.'+data.user.id,{method:'PATCH',headers:{...authHeaders(currentSession.access_token),'Prefer':'return=minimal'},body:JSON.stringify({name,username,role:'coordinator',must_change_password:true})});loginDirectory[username]=email;await loadProfiles();render();toast('Usuário criado e carregado da base com sucesso')}catch(e){if(/already registered/i.test(e.message)){await loadProfiles();render();toast('Este usuário já estava cadastrado e foi carregado da base.')}else showNewUserMessage(e.message,'error')}finally{btn.disabled=false;btn.textContent='Criar usuário'}}
function render(){renderNav();let html;if(view==='settings')html=settingsView();else if(view==='users')html=usersView();else if(view==='userEdit')html=userEditView();else if(view==='home')html=current.role==='manager'&&!space?managerHome():coordHome(space||current);else if(view==='activities')html=activityView();else if(view==='agenda')html=agendaName?agenda():meetings();else html=historyView();document.getElementById('content').innerHTML=html;window.scrollTo(0,0)}
const recoveryParams=new URLSearchParams(location.hash.slice(1)),recoveryQuery=new URLSearchParams(location.search);
if(recoveryQuery.get('recovery')==='confirm'&&recoveryQuery.get('token_hash'))showAuth('recoveryConfirm');
else if(recoveryParams.get('type')==='recovery'&&recoveryParams.get('access_token')){sessionStorage.setItem('g11_recovery_session',JSON.stringify({access_token:recoveryParams.get('access_token')}));showAuth('recovery')}
else if(recoveryQuery.get('recovery')==='1'||recoveryQuery.get('recovery')==='active')showAuth('recovery','Este link não trouxe uma sessão válida. Solicite um novo link.');
else{const saved=sessionStorage.getItem('g11_session');if(saved){try{enterApp(JSON.parse(saved)).catch(()=>{sessionStorage.removeItem('g11_session');showAuth()})}catch(e){showAuth()}}else showAuth()}
</script>
</body></html>
