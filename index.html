<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gestão 1:1 — Coordenação SAC</title>
<style>
:root{--orange:#f58220;--orange2:#c75c0d;--navy:#12263f;--ink:#20344d;--muted:#657286;--bg:#f6f8fa;--line:#e0e6ec;--white:#fff;--red:#b92f28;--purple:#6845a5;--radius:18px}
*{box-sizing:border-box}body{margin:0;font:15px/1.45 Arial,Helvetica,sans-serif;background:var(--bg);color:var(--navy)}button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}
header{position:sticky;top:0;z-index:20;background:#fffffff2;border-bottom:1px solid var(--line);backdrop-filter:blur(10px)}.head{height:66px;max-width:1240px;margin:auto;padding:0 22px;display:flex;align-items:center;justify-content:space-between}.eyebrow{font-size:10px;font-weight:900;letter-spacing:.18em;color:var(--orange);text-transform:uppercase}.brand{font-size:18px;font-weight:900}.profile{display:flex;align-items:center;gap:10px;border:0;background:transparent}.avatar{width:39px;height:39px;border-radius:50%;display:grid;place-items:center;background:var(--navy);color:#fff;font-weight:900}
nav.desktop{display:flex;gap:3px}.navbtn{border:0;border-radius:9px;background:transparent;color:var(--muted);font-size:13px;font-weight:800;padding:9px 11px}.navbtn.active{color:var(--orange2);background:#fff0e3}
main{max-width:1240px;margin:auto;padding:28px 22px 100px}.top{display:flex;align-items:end;justify-content:space-between;gap:18px;flex-wrap:wrap}h1{margin:3px 0 0;font-size:30px;line-height:1.15}h2{font-size:19px;margin:0}.muted{color:var(--muted)}.btn{border:0;border-radius:12px;background:var(--orange);color:#fff;font-weight:900;padding:11px 17px}.btn:disabled{opacity:.65;cursor:wait}.btn.dark{background:var(--navy)}.btn.outline{background:#fff;color:var(--orange2);border:1px solid var(--orange)}.btn.small{padding:8px 11px;font-size:12px}.grid{display:grid;gap:14px}.stats{grid-template-columns:repeat(4,1fr);margin-top:22px}.card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:0 3px 15px #12263f08}.stat b{font-size:26px;display:block}.stat span{font-size:13px;color:var(--muted)}.quick{margin-top:22px;border-color:#f0d6c0;background:#fffaf6}.quickrow{display:flex;gap:9px;margin-top:9px}.quick input{flex:1;min-width:120px}.field{height:46px;width:100%;border:1px solid #ced6df;border-radius:11px;background:#fff;padding:0 13px;outline:none}.field:focus{border-color:var(--orange);box-shadow:0 0 0 3px #f5822025}.sectionhead{margin:30px 0 13px;display:flex;justify-content:space-between;align-items:end}.people{grid-template-columns:repeat(5,1fr)}.person .circle{width:45px;height:45px;border-radius:50%;display:grid;place-items:center;background:#fff0e3;color:var(--orange2);font-weight:900}.person h3{margin:12px 0 8px}.counts{display:grid;grid-template-columns:1fr 1fr;font-size:12px;color:var(--muted)}.counts b{display:block;font-size:20px;color:var(--navy)}.person .actions{display:grid;gap:7px;margin-top:15px}.activities{grid-template-columns:repeat(2,1fr)}.activity h3{margin:10px 0 13px;font-size:16px}.tags{display:flex;gap:6px;flex-wrap:wrap}.tag{font-size:11px;font-weight:800;border-radius:999px;padding:5px 9px}.new{background:#eaf3ff;color:#245a9c}.progress{background:#fff0e3;color:#ad530d}.waiting{background:#f2ecff;color:var(--purple)}.done{background:#eef0f3;color:#596374}.late{background:#fff0ef;color:var(--red)}.meta{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;font-size:11px;color:var(--muted)}.meta b{display:block;color:var(--ink);margin-top:2px}.cardactions{border-top:1px solid #edf0f3;margin-top:14px;padding-top:12px;display:flex;gap:7px;flex-wrap:wrap}.statusSelect{border:1px solid #ced6df;border-radius:9px;padding:7px;background:#fff;font-size:12px;font-weight:700}.toast{position:fixed;z-index:50;bottom:25px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:12px 17px;border-radius:12px;font-weight:800;box-shadow:0 8px 30px #0003}.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 15% 10%,#fff0e3 0,transparent 28%),linear-gradient(145deg,#f7f9fb,#eef3f8)}.loginbox{width:min(460px,100%);padding:34px;background:#fff;border:1px solid var(--line);border-radius:28px;box-shadow:0 24px 80px #12263f20}.logomark{width:54px;height:54px;border-radius:17px;background:var(--orange);color:#fff;display:grid;place-items:center;font-weight:900;margin-bottom:25px}.login button{width:100%;margin-top:12px}.login label{display:block;font-weight:800;margin:13px 0 6px}.authlinks{display:flex;justify-content:space-between;gap:10px;margin-top:16px}.linkbtn{border:0;background:transparent;color:var(--orange2);font-weight:800;padding:0}.authmsg{border-radius:11px;padding:10px 12px;margin-top:14px;font-size:13px}.authmsg.error{background:#fff0ef;color:var(--red)}.authmsg.ok{background:#eef5ff;color:#245a9c}.notice{background:#f5f7fa;border-radius:12px;padding:11px;margin-top:18px;font-size:12px;color:var(--muted)}.agendahead{background:var(--navy);color:#fff;border-radius:24px;padding:26px}.agendahead .eyebrow{color:#ffb77d}.agendaGroup{margin-top:12px}.agendaItem{display:flex;gap:10px;background:#f7f9fb;border-radius:11px;padding:11px;margin-top:8px}.agendaItem input{accent-color:var(--orange)}textarea{width:100%;min-height:90px;border:1px solid #ced6df;border-radius:11px;padding:11px}.historyItem{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid #edf0f3}.historyItem:last-child{border:0}.mobile{display:none}.back{border:0;background:transparent;color:var(--muted);font-weight:800;margin-bottom:14px}.search{max-width:280px;width:100%}
@media(max-width:950px){.people{grid-template-columns:repeat(2,1fr)}.stats{grid-template-columns:repeat(2,1fr)}nav.desktop{display:none}.mobile{display:grid;position:fixed;z-index:40;bottom:0;left:0;right:0;grid-template-columns:repeat(4,1fr);background:#fff;border-top:1px solid var(--line);padding:7px}.mobile button{border:0;background:transparent;color:var(--muted);font-size:11px;font-weight:800;padding:7px}.mobile button.active{color:var(--orange2)}}@media(max-width:650px){main{padding:22px 15px 92px}.head{padding:0 15px}h1{font-size:25px}.activities,.people{grid-template-columns:1fr}.quickrow{flex-direction:column}.quickrow .field,.quickrow .btn{width:100%}.meta{grid-template-columns:repeat(2,1fr)}.profileName{display:none}.agendahead{padding:20px}.stats{gap:9px}.card{padding:15px}}
@media print{header,.mobile,.noPrint,.back{display:none!important}body{background:#fff}main{padding:0}.agendahead{background:#12263f!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}}
</style>
</head>
<body>
<section id="login" class="login"><div class="loginbox"><div class="logomark">1:1</div><div class="eyebrow">Coordenação SAC</div><div class="brand">Gestão 1:1</div><div id="authContent"></div></div></section>
<div id="app" class="hidden"><header><div class="head"><div><div class="eyebrow">Coordenação SAC</div><div class="brand">Gestão 1:1</div></div><nav class="desktop" id="desktopNav"></nav><button class="profile" onclick="logout()"><span class="profileName"><b id="userName"></b><small class="muted" style="display:block" id="userRole"></small></span><span class="avatar" id="avatar"></span></button></div></header><main id="content"></main><nav class="mobile" id="mobileNav"></nav></div>
<div id="toast" class="toast hidden"></div>
<script>
const users=[{name:'Erika Araujo',username:'erika.araujo',role:'manager'},{name:'Lucas Vital',username:'lucas.vital',role:'coordinator',next:'A definir'},{name:'Jose Ponciano',username:'jose.ponciano',role:'coordinator',next:'A definir'},{name:'Carmelita Ferre',username:'carmelita.ferre',role:'coordinator',next:'A definir'}];
const loginDirectory={'adm':'ajsacess@gmail.com','erika.araujo':'erika.araujof@hapvida.com.br','lucas.vital':'lucas.vital@hapvida.com.br','jose.ponciano':'jose.ponciano@hapvida.com.br','carmelita.ferre':'carmelita.ferre@hapvida.com.br'};
const SUPABASE_URL='https://zrqlplyhhpbnfajfodse.supabase.co';
const SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpycWxwbHloaHBibmZhamZvZHNlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgyNTM4OTksImV4cCI6MjEwMzgyOTg5OX0.uhTY0uxHb_g7iedv6yGXD8WItoMSqQTgprgzlhxQybM';
const ADMIN_EMAIL='ajsacess@gmail.com';
let activities=[
{id:1,title:'Revisar plano de ação do Backoffice',coord:'Ailo',owner:'Ailo',status:'Em andamento',priority:'Alta',category:'Projeto',due:'03 set',late:true,comments:3,updated:'Hoje, 08:42'},
{id:2,title:'Validar redistribuição dos novos colaboradores',coord:'Noemy',owner:'Erika',status:'Aguardando Erika',priority:'Urgente',category:'Decisão necessária',due:'02 set',comments:2,updated:'Ontem, 16:30'},
{id:3,title:'Atualizar indicador operacional',coord:'Robson',owner:'Robson',status:'Novo',priority:'Média',category:'Resultado ou entrega',due:'05 set',comments:0,updated:'Hoje, 09:05'},
{id:4,title:'Alinhar capacitação da equipe',coord:'Fran',owner:'Fran',status:'Aguardando coordenador',priority:'Média',category:'Pessoas e equipe',due:'08 set',comments:4,updated:'29 ago, 14:20'},
{id:5,title:'Avaliar risco de dimensionamento',coord:'Lucas',owner:'Erika',status:'Em andamento',priority:'Alta',category:'Risco',due:'01 set',late:true,comments:6,updated:'Hoje, 07:55'},
{id:6,title:'Definir responsável pelo novo fluxo',coord:'Ailo',owner:'Erika',status:'Aguardando Erika',priority:'Alta',category:'Decisão necessária',due:'06 set',comments:1,updated:'30 ago, 11:10'},
{id:7,title:'Consolidar devolutiva da monitoria',coord:'Noemy',owner:'Noemy',status:'Concluído',priority:'Média',category:'Desenvolvimento e feedback',due:'29 ago',comments:2,updated:'29 ago, 17:45'}];
let current=null,view='home',space=null,agendaName='';
const navs={manager:[['home','Visão geral'],['activities','Atividades'],['agenda','Reuniões'],['history','Histórico']],coordinator:[['home','Início'],['activities','Atividades'],['agenda','Reuniões'],['history','Histórico']]};
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function authHeaders(token){return {'apikey':SUPABASE_KEY,'Authorization':'Bearer '+(token||SUPABASE_KEY),'Content-Type':'application/json'}}
function authMessage(text,type='error'){return '<div class="authmsg '+type+'">'+esc(text)+'</div>'}
function showAuth(mode='login',message='',type='error'){
 const box=document.getElementById('authContent'),msg=message?authMessage(message,type):'';
 if(mode==='signup')box.innerHTML='<h1 style="margin-top:26px">Criar acesso</h1><p class="muted">Cadastre seus dados para acessar seu espaço individual.</p><label>Nome</label><input id="authName" class="field" autocomplete="name"><label>E-mail</label><input id="authEmail" class="field" type="email" autocomplete="email"><label>Senha</label><input id="authPass" class="field" type="password" autocomplete="new-password"><label>Repita a senha</label><input id="authPass2" class="field" type="password" autocomplete="new-password">'+msg+'<button id="authSubmit" class="btn" onclick="signUp()">Cadastrar</button><div class="authlinks"><button class="linkbtn" onclick="showAuth()">Voltar ao login</button></div>';
 else if(mode==='reset')box.innerHTML='<h1 style="margin-top:26px">Esqueci minha senha</h1><p class="muted">Informe o e-mail cadastrado para receber o link de alteração.</p><label>E-mail</label><input id="authEmail" class="field" type="email" autocomplete="email">'+msg+'<button id="authSubmit" class="btn" onclick="resetPassword()">Enviar link</button><div class="authlinks"><button class="linkbtn" onclick="showAuth()">Voltar ao login</button></div>';
 else if(mode==='recovery'||mode==='firstAccess')box.innerHTML='<h1 style="margin-top:26px">'+(mode==='firstAccess'?'Troca obrigatória de senha':'Criar nova senha')+'</h1><p class="muted">'+(mode==='firstAccess'?'Por segurança, crie uma senha pessoal antes de continuar.':'Digite e confirme sua nova senha.')+'</p><label>Nova senha</label><input id="authPass" class="field" type="password"><label>Repita a senha</label><input id="authPass2" class="field" type="password">'+msg+'<button id="authSubmit" class="btn" onclick="updatePassword(\''+mode+'\')">Alterar senha</button>';
 else box.innerHTML='<h1 style="margin-top:26px">Olá! Vamos começar?</h1><p class="muted">Entre com seu usuário e senha.</p><label>Login ou e-mail</label><input id="authLogin" class="field" autocomplete="username" placeholder="Ex.: Adm ou nome@empresa.com"><label>Senha</label><input id="authPass" class="field" type="password" autocomplete="current-password" onkeydown="if(event.key===\'Enter\')signIn()">'+msg+'<button id="authSubmit" class="btn" onclick="signIn()">Entrar</button><div class="authlinks"><button class="linkbtn" onclick="showAuth(\'reset\')">Esqueci a senha</button><button class="linkbtn" onclick="showAuth(\'signup\')">Criar acesso</button></div><div class="notice">Acesso protegido pelo Supabase. Cada usuário visualiza somente seu próprio espaço.</div>';
}
function setAuthBusy(busy,label='Entrar'){const b=document.getElementById('authSubmit');if(b){b.disabled=busy;b.textContent=busy?'Aguarde...':label}}
async function signIn(){const login=document.getElementById('authLogin').value.trim().toLowerCase(),password=document.getElementById('authPass').value;if(!login||!password)return showAuth('login','Informe o usuário e a senha.');setAuthBusy(true);try{const email=login.includes('@')?login:loginDirectory[login];if(!email)throw new Error('Usuário ou senha inválidos.');const res=await fetch(SUPABASE_URL+'/auth/v1/token?grant_type=password',{method:'POST',headers:authHeaders(),body:JSON.stringify({email,password})});const data=await res.json();if(!res.ok)throw new Error('Usuário ou senha inválidos.');const bytes=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(password)),hash=[...new Uint8Array(bytes)].map(b=>b.toString(16).padStart(2,'0')).join('');sessionStorage.setItem('g11_session',JSON.stringify(data));if(hash==='e197939568376f47e750636b3f6901c7925b79dfaeacfd28f558e21be8ff7be8')sessionStorage.setItem('g11_force_change','1');await enterApp(data)}catch(e){showAuth('login',e.message)}}
async function enterApp(session){const email=session.user.email,meta=session.user.user_metadata||{};let name=meta.name||email.split('@')[0],role=email===ADMIN_EMAIL?'admin':'coordinator',username=email.split('@')[0],mustChange=sessionStorage.getItem('g11_force_change')==='1';try{const r=await fetch(SUPABASE_URL+'/rest/v1/profiles?id=eq.'+session.user.id+'&select=name,role,username,must_change_password',{headers:authHeaders(session.access_token)});const p=(await r.json())[0];if(p){name=p.name||name;role=p.role||role;username=p.username||username;mustChange=mustChange||!!p.must_change_password}}catch(e){}if(mustChange){showAuth('firstAccess');return}current=users.find(u=>u.username===username)||{name,username,role,next:'A definir'};current.role=role;document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');document.getElementById('userName').textContent=current.name;document.getElementById('userRole').textContent=role==='admin'?'Administrador':role==='manager'?'Gerente':'Coordenador(a)';document.getElementById('avatar').textContent=current.name[0].toUpperCase();view='home';space=null;render()}
async function signUp(){const name=document.getElementById('authName').value.trim(),email=document.getElementById('authEmail').value.trim(),password=document.getElementById('authPass').value,password2=document.getElementById('authPass2').value;if(!name||!email||!password||!password2)return showAuth('signup','Preencha todos os campos.');if(password!==password2)return showAuth('signup','As senhas não coincidem.');if(password.length<6)return showAuth('signup','A senha precisa ter pelo menos 6 caracteres.');setAuthBusy(true);try{const res=await fetch(SUPABASE_URL+'/auth/v1/signup',{method:'POST',headers:authHeaders(),body:JSON.stringify({email,password,data:{name}})});const data=await res.json();if(!res.ok)throw new Error(data.msg||data.message||'Não foi possível cadastrar.');showAuth('login','Cadastro realizado. Verifique seu e-mail caso seja solicitada confirmação.','ok')}catch(e){showAuth('signup',e.message)}}
async function resetPassword(){const email=document.getElementById('authEmail').value.trim();if(!email)return showAuth('reset','Informe seu e-mail.');setAuthBusy(true);try{const res=await fetch(SUPABASE_URL+'/auth/v1/recover?redirect_to='+encodeURIComponent(location.origin),{method:'POST',headers:authHeaders(),body:JSON.stringify({email})});if(!res.ok)throw new Error('Não foi possível enviar o link.');showAuth('reset','Se o e-mail estiver cadastrado, o link de alteração será enviado.','ok')}catch(e){showAuth('reset',e.message)}}
async function updatePassword(mode='recovery'){const p=document.getElementById('authPass').value,p2=document.getElementById('authPass2').value;if(p!==p2||p.length<8)return showAuth(mode,'As senhas devem coincidir e ter pelo menos 8 caracteres.');const saved=JSON.parse(sessionStorage.getItem('g11_session')||'null'),token=mode==='firstAccess'?saved?.access_token:new URLSearchParams(location.hash.slice(1)).get('access_token');setAuthBusy(true);try{const res=await fetch(SUPABASE_URL+'/auth/v1/user',{method:'PUT',headers:authHeaders(token),body:JSON.stringify({password:p})});if(!res.ok)throw new Error('Não foi possível alterar a senha.');if(mode==='firstAccess')await fetch(SUPABASE_URL+'/rest/v1/rpc/complete_first_login',{method:'POST',headers:authHeaders(token),body:'{}'});history.replaceState({},'',location.pathname);sessionStorage.removeItem('g11_session');sessionStorage.removeItem('g11_force_change');showAuth('login','Senha alterada. Entre novamente com sua nova senha.','ok')}catch(e){showAuth(mode,e.message)}}
function logout(){sessionStorage.removeItem('g11_session');current=null;document.getElementById('app').classList.add('hidden');document.getElementById('login').classList.remove('hidden');showAuth()}
function setView(v){view=v;space=null;agendaName='';render()}
function renderNav(){const html=navs[current.role].map(n=>'<button class="navbtn '+(view===n[0]?'active':'')+'" onclick="setView(\''+n[0]+'\')">'+n[1]+'</button>').join('');document.getElementById('desktopNav').innerHTML=html;document.getElementById('mobileNav').innerHTML=html}
function toast(msg){const t=document.getElementById('toast');t.textContent='✓ '+msg;t.classList.remove('hidden');clearTimeout(window.tt);window.tt=setTimeout(()=>t.classList.add('hidden'),2300)}
function visible(){return activities.filter(a=>current.role==='manager'||a.coord===current.name)}
function stat(label,value){return '<div class="card stat"><b>'+value+'</b><span>'+label+'</span></div>'}
function quick(coord){return '<div class="card quick"><b>Inclusão rápida</b><div class="quickrow"><input class="field" id="quickTitle" placeholder="O que precisamos acompanhar?">'+(coord?'':'<select class="field" id="quickCoord">'+users.slice(1).map(u=>'<option>'+u.name+'</option>').join('')+'</select>')+'<button class="btn" onclick="addActivity(\''+(coord||'')+'\')">＋ Salvar</button></div></div>'}
function addActivity(coord){const inp=document.getElementById('quickTitle'),title=inp.value.trim();if(!title){toast('Digite o título da atividade');return}const c=coord||document.getElementById('quickCoord').value;activities.unshift({id:Date.now(),title,coord:c,owner:current.name,status:'Novo',priority:'Média',category:'Atividade',due:'Sem prazo',comments:0,updated:'Agora'});toast('Atividade criada com sucesso');render()}
function tagClass(s){return s==='Novo'?'new':s==='Em andamento'?'progress':s==='Concluído'?'done':'waiting'}
function card(a){return '<article class="card activity"><div class="tags"><span class="tag '+tagClass(a.status)+'">'+a.status+'</span>'+(a.late&&a.status!=='Concluído'?'<span class="tag late">⚠ Atrasada</span>':'')+'</div><h3>'+esc(a.title)+'</h3><div class="meta"><span>Responsável<b>'+a.owner+'</b></span><span>Prioridade<b>'+a.priority+'</b></span><span>Prazo<b>'+a.due+'</b></span><span>Atualização<b>'+a.updated+'</b></span></div><div class="cardactions">'+(a.status!=='Concluído'?'<button class="btn dark small" onclick="complete('+a.id+')">✓ Concluir</button>':'<button class="btn outline small" onclick="reopen('+a.id+')">Reabrir</button>')+'<select class="statusSelect" onchange="updateStatus('+a.id+',this.value)"><option '+sel(a,'Novo')+'>Novo</option><option '+sel(a,'Em andamento')+'>Em andamento</option><option '+sel(a,'Aguardando Erika')+'>Aguardando Erika</option><option '+sel(a,'Aguardando coordenador')+'>Aguardando coordenador</option><option '+sel(a,'Concluído')+'>Concluído</option></select><button class="navbtn" onclick="comment('+a.id+')">💬 '+a.comments+'</button></div></article>'}
function sel(a,s){return a.status===s?'selected':''}function updateStatus(id,status){const a=activities.find(x=>x.id===id);a.status=status;a.updated='Agora';if(status==='Concluído')a.late=false;toast('Atividade atualizada');render()}function complete(id){updateStatus(id,'Concluído')}function reopen(id){updateStatus(id,'Em andamento')}function comment(id){const a=activities.find(x=>x.id===id),txt=prompt('Registrar uma observação:');if(txt&&txt.trim()){a.comments++;a.updated='Agora';toast('Comentário registrado');render()}}
function openSpace(name){space=users.find(u=>u.name===name);view='home';render()}function openAgenda(name){agendaName=name;view='agenda';render()}
function managerHome(){const open=activities.filter(a=>a.status!=='Concluído');return '<div class="top"><div><div class="muted"><b>Terça-feira, 1 de setembro</b></div><h1>Bom dia, Erika!</h1><div class="muted">Acompanhe sua equipe e prepare os próximos encontros.</div></div></div>'+quick('')+'<div class="grid stats">'+stat('Em aberto',open.length)+stat('Atrasadas',open.filter(a=>a.late).length)+stat('Aguardando você',open.filter(a=>a.owner==='Erika').length)+stat('Concluídas',activities.filter(a=>a.status==='Concluído').length)+'</div><div class="sectionhead"><div><h2>Coordenadores</h2><div class="muted">Uma visão rápida de cada espaço</div></div></div><div class="grid people">'+users.slice(1).map(u=>{const m=open.filter(a=>a.coord===u.name);return '<article class="card person"><div class="circle">'+u.name[0]+'</div><h3>'+u.name+'</h3><div class="muted" style="font-size:12px">Próximo 1:1 • '+u.next+'</div><div class="counts"><p><b>'+m.length+'</b>abertas</p><p><b style="color:var(--red)">'+m.filter(a=>a.late).length+'</b>atrasadas</p></div><div class="actions"><button class="btn dark small" onclick="openSpace(\''+u.name+'\')">Abrir espaço</button><button class="btn outline small" onclick="openAgenda(\''+u.name+'\')">Preparar 1:1</button></div></article>'}).join('')+'</div>'}
function coordHome(u){const mine=activities.filter(a=>a.coord===u.name);return (space?'<button class="back" onclick="space=null;render()">← Voltar ao painel</button>':'')+'<div class="top"><div><div class="muted"><b>Próximo 1:1 • '+u.next+'</b></div><h1>Olá, '+u.name+'!</h1><div class="muted">Aqui estão os assuntos e atividades para acompanharmos juntos.</div></div><button class="btn dark" onclick="openAgenda(\''+u.name+'\')">✦ Preparar meu 1:1</button></div>'+quick(u.name)+'<div class="grid stats">'+stat('Em aberto',mine.filter(a=>a.status!=='Concluído').length)+stat('Atrasadas',mine.filter(a=>a.late).length)+stat('Aguardando Erika',mine.filter(a=>a.status==='Aguardando Erika').length)+stat('Concluídas',mine.filter(a=>a.status==='Concluído').length)+'</div><div class="sectionhead"><h2>Atividades em destaque</h2><span class="muted">'+mine.length+' itens</span></div><div class="grid activities">'+mine.map(card).join('')+'</div>'}
function activityView(){return '<div class="top"><div><h1>Atividades</h1><div class="muted">Acompanhe e atualize em poucos cliques.</div></div><input class="field search" id="search" placeholder="Pesquisar atividade" oninput="filterCards(this.value)"></div><div id="activityGrid" class="grid activities" style="margin-top:18px">'+visible().map(card).join('')+'</div>'}
function filterCards(q){const data=visible().filter(a=>a.title.toLowerCase().includes(q.toLowerCase()));document.getElementById('activityGrid').innerHTML=data.map(card).join('')||'<div class="card muted">Nenhuma atividade encontrada.</div>'}
function meetings(){const list=current.role==='manager'?users.slice(1):[current];return '<h1>Próximas reuniões</h1><p class="muted">Prepare a pauta automaticamente.</p><div class="grid activities">'+list.map(u=>'<button class="card" style="text-align:left" onclick="openAgenda(\''+u.name+'\')"><b>'+u.name+'</b><span class="muted" style="display:block">'+u.next+'</span><span style="float:right;color:var(--orange)">✦ Preparar pauta</span></button>').join('')+'</div>'}
function agenda(){const mine=activities.filter(a=>a.coord===agendaName&&a.status!=='Concluído'),groups=['Atividades atrasadas','Decisões necessárias','Riscos e impedimentos','Itens aguardando atuação','Pessoas, equipe e desenvolvimento'];return '<button class="back noPrint" onclick="agendaName=\'\';view=\'home\';render()">← Voltar</button><div class="agendahead"><div class="eyebrow">Pauta automática</div><h1>1:1 • Erika e '+agendaName+'</h1><p style="opacity:.7">Preparada em 1 de setembro de 2026 • '+mine.length+' assuntos em aberto</p><button class="btn small noPrint" onclick="copyAgenda()">Copiar pauta</button> <button class="btn outline small noPrint" onclick="print()">Imprimir / PDF</button></div>'+groups.map((g,i)=>'<section class="card agendaGroup"><h2>'+g+'</h2>'+mine.filter((a,n)=>n%4===i).map(a=>'<label class="agendaItem"><input type="checkbox"><span><b>'+esc(a.title)+'</b><small class="muted" style="display:block">'+a.owner+' • prazo '+a.due+'</small></span></label>').join('')+(i===4?'<textarea placeholder="Inclua temas adicionais, decisões e combinados..."></textarea>':'')+'</section>').join('')}
function copyAgenda(){const text='Pauta 1:1 — Erika e '+agendaName+'\n'+activities.filter(a=>a.coord===agendaName&&a.status!=='Concluído').map(a=>'• '+a.title).join('\n');navigator.clipboard?navigator.clipboard.writeText(text).then(()=>toast('Pauta copiada')):toast('Use Imprimir / PDF')}
function history(){return '<h1>Histórico</h1><p class="muted">Reuniões, decisões e alterações recentes.</p><div class="card" style="margin-top:18px">'+visible().slice(0,7).map((a,i)=>'<div class="historyItem"><span class="circle">✓</span><div><b>'+a.updated+'</b><div class="muted">'+esc(a.title)+' — '+(i%2?'comentário adicionado':'status atualizado para '+a.status)+'</div></div></div>').join('')+'</div>'}
function render(){renderNav();let html;if(view==='home')html=current.role==='manager'&&!space?managerHome():coordHome(space||current);else if(view==='activities')html=activityView();else if(view==='agenda')html=agendaName?agenda():meetings();else html=history();document.getElementById('content').innerHTML=html;window.scrollTo(0,0)}
const recoveryParams=new URLSearchParams(location.hash.slice(1));
if(recoveryParams.get('type')==='recovery'&&recoveryParams.get('access_token'))showAuth('recovery');
else{const saved=sessionStorage.getItem('g11_session');if(saved){try{enterApp(JSON.parse(saved)).catch(()=>{sessionStorage.removeItem('g11_session');showAuth()})}catch(e){showAuth()}}else showAuth()}
</script>
</body></html>
