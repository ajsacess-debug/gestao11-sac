th:100%;min-height:90px;border:1px solid #ced6df;border-radius:11px;padding:11px}.historyItem{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid #edf0f3}.historyItem:last-child{border:0}.mobile{display:none}.back{border:0;background:transparent;color:var(--muted);font-weight:800;margin-bottom:14px}.search{max-width:280px;width:100%}

function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function authHeaders(token){return {'apikey':SUPABASE_KEY,'Authorization':'Bearer '+(token||SUPABASE_KEY),'Content-Type':'application/json'}}
function authMessage(text,type='error'){return '<div class="authmsg '+type+'">'+esc(text)+'</div>'}
function passwordError(p){if(p.length<8)return 'A senha deve ter pelo menos 8 caracteres.';if(!/[A-Za-zÀ-ÿ]/.test(p))return 'A senha deve conter pelo menos uma letra.';if(!/\d/.test(p))return 'A senha deve conter pelo menos um número.';if(!/[^A-Za-zÀ-ÿ0-9]/.test(p))return 'A senha deve conter pelo menos um caractere especial.';return ''}
const passwordHint='<div class="settingsHint">Mínimo de 8 caracteres, com letra, número e caractere especial.</div>';
function showAuth(mode='login',message='',type='error'){
 const box=document.getElementById('authContent'),msg=message?authMessage(message,type):'',savedAuth=JSON.parse(sessionStorage.getItem('g11_session')||'null'),recoveryEmail=sessionStorage.getItem('g11_reset_email')||savedAuth?.user?.email||'';
 if(mode==='reset')box.innerHTML='<h1 style="margin-top:26px">Esqueci minha senha</h1><p class="muted">Informe o e-mail cadastrado para receber o link de alteração.</p><label>E-mail</label><input id="authEmail" class="field" type="email" autocomplete="email">'+msg+'<button id="authSubmit" class="btn" onclick="resetPassword()">Enviar link</button><div class="authlinks"><button class="linkbtn" onclick="showAuth()">Voltar ao login</button></div>';
 else if(mode==='recovery'||mode==='firstAccess')box.innerHTML='<h1 style="margin-top:26px">'+(mode==='firstAccess'?'Troca obrigatória de senha':'Criar nova senha')+'</h1><p class="muted">'+(mode==='firstAccess'?'Por segurança, crie uma senha pessoal antes de continuar.':'Confirme seu e-mail e defina uma nova senha.')+'</p><label>E-mail</label><input id="recoveryEmail" class="field" type="email" autocomplete="email" value="'+esc(recoveryEmail)+'"><label>Nova senha</label><input id="authPass" class="field" type="password" autocomplete="new-password">'+passwordHint+'<label>Repita a nova senha</label><input id="authPass2" class="field" type="password" autocomplete="new-password">'+msg+'<button id="authSubmit" class="btn" onclick="updatePassword(\''+mode+'\')">Alterar senha</button><div class="authlinks"><button class="linkbtn" onclick="showAuth()">Voltar ao login</button></div>';
 else box.innerHTML='<h1 style="margin-top:26px">Olá! Vamos começar?</h1><p class="muted">Entre com seu usuário e senha.</p><label>Login ou e-mail</label><input id="authLogin" class="field" autocomplete="username" placeholder="Ex.: Adm ou nome@empresa.com"><label>Senha</label><input id="authPass" class="field" type="password" autocomplete="current-password" onkeydown="if(event.key===\'Enter\')signIn()">'+msg+'<button id="authSubmit" class="btn" onclick="signIn()">Entrar</button><div class="authlinks"><button class="linkbtn" onclick="showAuth(\'reset\')">Esqueci a senha</button></div><div class="notice">Novos acessos são cadastrados pelo gerente ou administrador.</div>';
}
function setAuthBusy(busy,label='Entrar'){const b=document.getElementById('authSubmit');if(b){b.disabled=busy;b.textContent=busy?'Aguarde...':label}}
async function signIn(){const login=document.getElementById('authLogin').value.trim().toLowerCase(),password=document.getElementById('authPass').value;if(!login||!password)return showAuth('login','Informe o usuário e a senha.');setAuthBusy(true);try{const email=login.includes('@')?login:loginDirectory[login];if(!email)throw new Error('Usuário ou senha inválidos.');const res=await fetch(SUPABASE_URL+'/auth/v1/token?grant_type=password',{method:'POST',headers:authHeaders(),body:JSON.stringify({email,password})});const data=await res.json();if(!res.ok)throw new Error('Usuário ou senha inválidos.');const bytes=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(password)),hash=[...new Uint8Array(bytes)].map(b=>b.toString(16).padStart(2,'0')).join('');sessionStorage.setItem('g11_session',JSON.stringify(data));if(hash==='e197939568376f47e750636b3f6901c7925b79dfaeacfd28f558e21be8ff7be8')sessionStorage.setItem('g11_force_change','1');else sessionStorage.removeItem('g11_force_change');await enterApp(data)}catch(e){showAuth('login',e.message)}}
async function enterApp(session){currentSession=session;const email=session.user.email,meta=session.user.user_metadata||{};let name=meta.name||(email===ADMIN_EMAIL?'Adm':email.split('@')[0]),role=email===ADMIN_EMAIL?'admin':'coordinator',username=email===ADMIN_EMAIL?'adm':email.split('@')[0],mustChange=sessionStorage.getItem('g11_force_change')==='1';try{const r=await fetch(SUPABASE_URL+'/rest/v1/profiles?id=eq.'+session.user.id+'&select=name,role,username,must_change_password',{headers:authHeaders(session.access_token)});const p=(await r.json())[0];if(p){name=p.name||name;role=p.role||role;username=p.username||username;mustChange=mustChange||!!p.must_change_password}}catch(e){}if(mustChange){showAuth('firstAccess');return}const found=users.find(u=>u.username===username);current=found?{...found}:{name,username,role,next:'A definir'};current.role=role==='admin'?'manager':role;current.authRole=role;current.email=email;current.avatarUrl=localStorage.getItem('g11_avatar_'+session.user.id)||meta.avatar_url||'';if(role==='admin')current.name='Adm';document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');updateProfileHeader();view='home';space=null;render()}
async function resetPassword(){const email=document.getElementById('authEmail').value.trim();if(!email)return showAuth('reset','Informe seu e-mail.');sessionStorage.setItem('g11_reset_email',email);setAuthBusy(true);try{const redirect=location.origin+location.pathname+'?recovery=1';const res=await fetch(SUPABASE_URL+'/auth/v1/recover?redirect_to='+encodeURIComponent(redirect),{method:'POST',headers:authHeaders(),body:JSON.stringify({email})});if(!res.ok)throw new Error('Não foi possível enviar o link.');showAuth('reset','Se o e-mail estiver cadastrado, o link de alteração será enviado.','ok')}catch(e){showAuth('reset',e.message)}}
async function updatePassword(mode='recovery'){const email=document.getElementById('recoveryEmail').value.trim(),p=document.getElementById('authPass').value,p2=document.getElementById('authPass2').value,policy=passwordError(p);if(!email)return showAuth(mode,'Informe o e-mail cadastrado.');if(p!==p2)return showAuth(mode,'As senhas não coincidem.');if(policy)return showAuth(mode,policy);const saved=JSON.parse(sessionStorage.getItem('g11_session')||'null'),hash=new URLSearchParams(location.hash.slice(1)),token=mode==='firstAccess'?saved?.access_token:hash.get('access_token');if(!token)return showAuth(mode,'Este link é inválido ou expirou. Solicite um novo link.');setAuthBusy(true);try{const check=await fetch(SUPABASE_URL+'/auth/v1/user',{headers:authHeaders(token)}),user=await check.json();if(!check.ok||String(user.email||'').toLowerCase()!==email.toLowerCase())throw new Error('O e-mail informado não corresponde ao link recebido.');const res=await fetch(SUPABASE_URL+'/auth/v1/user',{method:'PUT',headers:authHeaders(token),body:JSON.stringify({password:p,data:{...(user.user_metadata||{}),must_change_password:false}})});if(!res.ok)throw new Error('Não foi possível alterar a senha.');sessionStorage.removeItem('g11_force_change');try{await fetch(SUPABASE_URL+'/rest/v1/profiles?id=eq.'+user.id,{method:'PATCH',headers:{...authHeaders(token),'Prefer':'return=minimal'},body:JSON.stringify({must_change_password:false})});if(mode==='firstAccess')await fetch(SUPABASE_URL+'/rest/v1/rpc/complete_first_login',{method:'POST',headers:authHeaders(token),body:'{}'})}catch(e){}history.replaceState({},'',location.pathname);sessionStorage.removeItem('g11_session');sessionStorage.removeItem('g11_reset_email');showAuth('login','Senha alterada. Entre novamente com sua nova senha.','ok')}catch(e){showAuth(mode,e.message)}}
function updateProfileHeader(){document.getElementById('userName').textContent=current.name;document.getElementById('userRole').textContent=current.authRole==='admin'?'Administrador':current.role==='manager'?'Gerente':'Coordenador(a)';const a=document.getElementById('avatar');a.textContent=current.avatarUrl?'':current.name[0].toUpperCase();a.style.backgroundImage=current.avatarUrl?'url("'+current.avatarUrl.replace(/"/g,'')+'")':''}
function toggleProfileMenu(e){e.stopPropagation();const m=document.getElementById('profileMenu'),b=document.getElementById('profileButton'),open=m.classList.toggle('hidden');b.setAttribute('aria-expanded',String(!open))}
function closeProfileMenu(){document.getElementById('profileMenu')?.classList.add('hidden');document.getElementById('profileButton')?.setAttribute('aria-expanded','false')}
document.addEventListener('click',e=>{if(!e.target.closest('.profileWrap'))closeProfileMenu()});
function openSettings(){closeProfileMenu();view='settings';space=null;render()}
function settingsView(){pendingAvatar=current.avatarUrl||'';const known=Object.entries(loginDirectory).filter(([u])=>u!=='adm').map(([u,e])=>'<option value="'+esc(e)+'">'+esc(u)+' — '+esc(e)+'</option>').join(''),managed=current.role==='manager'?'<div class="card settingsForm" style="margin-top:22px"><h2>Redefinir senha de outro usuário</h2><p class="muted">Recurso exclusivo de ADM e Gerente. O usuário receberá um link seguro para criar a nova senha.</p><label>Usuário cadastrado</label><select class="field" onchange="document.getElementById(\'resetUserEmail\').value=this.value"><option value="">Selecionar usuário</option>'+known+'</select><label>E-mail do usuário</label><input class="field" id="resetUserEmail" type="email" autocomplete="email" placeholder="nome@empresa.com"><div class="settingsHint">A função “Esqueci a senha” da tela inicial permanece disponível normalmente.</div><div id="managedResetMessage"></div><div class="settingsActions"><button class="btn" id="managedResetButton" onclick="sendManagedPasswordReset()">Enviar link de redefinição</button></div></div>':'';return '<div class="top"><div><h1>Configurações da conta</h1><div class="muted">Atualize sua foto, e-mail ou senha.</div></div></div><div class="card settingsGrid"><div class="photoBox"><div class="photoPreview" id="photoPreview" style="background-image:'+(pendingAvatar?'url(&quot;'+esc(pendingAvatar)+'&quot;)':'none')+'">'+(pendingAvatar?'':esc(current.name[0].toUpperCase()))+'</div><label class="btn outline small" for="photoInput">Escolher foto</label><input class="hidden" id="photoInput" type="file" accept="image/png,image/jpeg,image/webp" onchange="previewPhoto(this)"><div class="settingsHint">JPG, PNG ou WebP. Até 2 MB.</div></div><div class="settingsForm"><label>Nome</label><input class="field" value="'+esc(current.name)+'" disabled><label>E-mail</label><input class="field" id="settingsEmail" type="email" value="'+esc(current.email)+'"><div class="settingsHint">A alteração de e-mail poderá exigir confirmação na caixa de entrada.</div><label>Nova senha</label><input class="field" id="settingsPassword" type="password" autocomplete="new-password" placeholder="Deixe em branco para não alterar"><label>Repita a nova senha</label><input class="field" id="settingsPassword2" type="password" autocomplete="new-password"><div id="settingsMessage"></div><div class="settingsActions"><button class="btn" id="saveSettingsButton" onclick="saveSettings()">Salvar alterações</button><button class="btn outline" onclick="setView(\'home\')">Cancelar</button></div></div></div>'+managed}
function previewPhoto(input){const f=input.files[0];if(!f)return;if(f.size>2*1024*1024){input.value='';return showSettingsMessage('A foto deve ter no máximo 2 MB.','error')}const reader=new FileReader();reader.onload=()=>{const img=new Image();img.onload=()=>{const size=180,c=document.createElement('canvas');c.width=c.height=size;const ctx=c.getContext('2d'),side=Math.min(img.width,img.height),sx=(img.width-side)/2,sy=(img.height-side)/2;ctx.drawImage(img,sx,sy,side,side,0,0,size,size);pendingAvatar=c.toDataURL('image/jpeg',.82);const p=document.getElementById('photoPreview');p.style.backgroundImage='url("'+pendingAvatar+'")';p.textContent=''};img.src=reader.result};reader.readAsDataURL(f)}
function showSettingsMessage(text,type){document.getElementById('settingsMessage').innerHTML=authMessage(text,type)}
async function saveSettings(){const email=document.getElementById('settingsEmail').value.trim(),password=document.getElementById('settingsPassword').value,p2=document.getElementById('settingsPassword2').value,emailChanged=email!==current.email;if(!email)return showSettingsMessage('Informe um e-mail válido.','error');if(password&&password!==p2)return showSettingsMessage('As senhas não coincidem.','error');if(password&&passwordError(password))return showSettingsMessage(passwordError(password),'error');const btn=document.getElementById('saveSettingsButton');btn.disabled=true;btn.textContent='Salvando...';try{const body={};if(emailChanged)body.email=email;if(password)body.password=password;let data=currentSession.user;if(Object.keys(body).length){const res=await fetch(SUPABASE_URL+'/auth/v1/user',{method:'PUT',headers:authHeaders(currentSession.access_token),body:JSON.stringify(body)});data=await res.json();if(!res.ok)throw new Error(data.msg||data.message||'Não foi possível salvar as alterações.')}current.avatarUrl=pendingAvatar;if(pendingAvatar)localStorage.setItem('g11_avatar_'+currentSession.user.id,pendingAvatar);else localStorage.removeItem('g11_avatar_'+currentSession.user.id);if(data.email)current.email=data.email;currentSession.user={...currentSession.user,...data};sessionStorage.setItem('g11_session',JSON.stringify(currentSession));updateProfileHeader();showSettingsMessage(emailChanged?'Alterações salvas. Confirme o novo e-mail para concluir a troca.':'Alterações salvas com sucesso.','ok');document.getElementById('settingsPassword').value='';document.getElementById('settingsPassword2').value=''}catch(e){showSettingsMessage(e.message,'error')}finally{btn.disabled=false;btn.textContent='Salvar alterações'}}
async function logout(){try{if(currentSession?.access_token)await fetch(SUPABASE_URL+'/auth/v1/logout',{method:'POST',headers:authHeaders(currentSession.access_token)})}catch(e){}sessionStorage.removeItem('g11_session');sessionStorage.removeItem('g11_force_change');current=null;currentSession=null;closeProfileMenu();document.getElementById('app').classList.add('hidden');document.getElementById('login').classList.remove('hidden');showAuth()}
function setView(v){view=v;space=null;agendaName='';render()}
function renderNav(){const html=navs[current.role].map(n=>'<button class="navbtn '+(view===n[0]?'active':'')+'" onclick="setView(\''+n[0]+'\')">'+n[1]+'</button>').join('');document.getElementById('desktopNav').innerHTML=html;document.getElementById('mobileNav').innerHTML=html}
function toast(msg){const t=document.getElementById('toast');t.textContent='✓ '+msg;t.classList.remove('hidden');clearTimeout(window.tt);window.tt=setTimeout(()=>t.classList.add('hidden'),2300)}
function visible(){return activities.filter(a=>current.role==='manager'||a.coord===current.name)}
function stat(label,value){return '<div class="card stat"><b>'+value+'</b><span>'+label+'</span></div>'}
function quick(coord){return '<div class="card quick"><b>Inclusão rápida</b><div class="quickrow"><input class="field" id="quickTitle" placeholder="O que precisamos acompanhar?">'+(coord?'':'<select class="field" id="quickCoord">'+users.slice(1).map(u=>'<option>'+u.name+'</option>').join('')+'</select>')+'<button class="btn" onclick="addActivity(\''+(coord||'')+'\')">＋ Salvar</button></div></div>'}
function addActivity(coord){const inp=document.getElementById('quickTitle'),title=inp.value.trim();if(!title){toast('Digite o título da atividade');return}const c=coord||document.getElementById('quickCoord').value;activities.unshift({id:Date.now(),title,coord:c,owner:current.name,status:'Novo',priority:'Média',category:'Atividade',due:'Sem prazo',comments:0,updated:'Agora'});toast('Atividade criada com sucesso');render()}
function tagClass(s){return s==='Novo'?'new':s==='Em andamento'?'progress':s==='Concluído'?'done':'waiting'}
function card(a){return '<article class="card activity"><div class="tags"><span class="tag '+tagClass(a.status)+'">'+a.status+'</span>'+(a.late&&a.status!=='Concluído'?'<span class="tag late">⚠ Atrasada</span>':'')+'</div><h3>'+esc(a.title)+'</h3><div class="meta"><span>Responsável<b>'+a.owner+'</b></span><span>Prioridade<b>'+a.priority+'</b></span><span>Prazo<b>'+a.due+'</b></span><span>Atualização<b>'+a.updated+'</b></span></div><div class="cardactions">'+(a.status!=='Concluído'?'<button class="btn dark small" onclick="complete('+a.id+')">✓ Concluir</button>':'<button class="btn outline small" onclick="reopen('+a.id+')">Reabrir</button>')+'<select class="statusSelect" onchange="updateStatus('+a.id+',this.value)"><option '+sel(a,'Novo')+'>Novo</option><option '+sel(a,'Em andamento')+'>Em andamento</option><option '+sel(a,'Aguardando Erika')+'>Aguardando Erika</option><option '+sel(a,'Aguardando coordenador')+'>Aguardando coordenador</option><option '+sel(a,'Concluído')+'>Concluído</option></select><button class="navbtn" onclick="comment('+a.id+')">💬 '+a.comments+'</button></div></article>'}
function sel(a,s){return a.status===s?'selected':''}function updateStatus(id,status){const a=activities.find(x=>x.id===id);a.status=status;a.updated='Agora';if(status==='Concluído')a.late=false;toast('Atividade atualizada');render()}function complete(id){updateStatus(id,'Concluído')}function reopen(id){updateStatus(id,'Em andamento')}function comment(id){const a=activities.find(x=>x.id===id),txt=prompt('Registrar uma observação:');if(txt&&txt.trim()){a.comments++;a.updated='Agora';toast('Comentário registrado');render()}}
function openSpace(name){space=users.find(u=>u.name===name);view='home';render()}function openAgenda(name){agendaName=name;view='agenda';render()}
function managerHome(){const open=activities.filter(a=>a.status!=='Concluído'),greeting=current.username==='adm'?'Adm':current.name.split(' ')[0];return '<div class="top"><div><div class="muted"><b>Terça-feira, 1 de setembro</b></div><h1>Bom dia, '+esc(greeting)+'!</h1><div class="muted">Acompanhe sua equipe e prepare os próximos encontros.</div></div></div>'+quick('')+'<div class="grid stats">'+stat('Em aberto',open.length)+stat('Atrasadas',open.filter(a=>a.late).length)+stat('Aguardando você',open.filter(a=>a.owner==='Erika').length)+stat('Concluídas',activities.filter(a=>a.status==='Concluído').length)+'</div><div class="sectionhead"><div><h2>Coordenadores</h2><div class="muted">Uma visão rápida de cada espaço</div></div></div><div class="grid people">'+users.slice(1).map(u=>{const m=open.filter(a=>a.coord===u.name);return '<article class="card person"><div class="circle">'+u.name[0]+'</div><h3>'+u.name+'</h3><div class="muted" style="font-size:12px">Próximo 1:1 • '+u.next+'</div><div class="counts"><p><b>'+m.length+'</b>abertas</p><p><b style="color:var(--red)">'+m.filter(a=>a.late).length+'</b>atrasadas</p></div><div class="actions"><button class="btn dark small" onclick="openSpace(\''+u.name+'\')">Abrir espaço</button><button class="btn outline small" onclick="openAgenda(\''+u.name+'\')">Preparar 1:1</button></div></article>'}).join('')+'</div>'}
function coordHome(u){const mine=activities.filter(a=>a.coord===u.name);return (space?'<button class="back" onclick="space=null;render()">← Voltar ao painel</button>':'')+'<div class="top"><div><div class="muted"><b>Próximo 1:1 • '+u.next+'</b></div><h1>Olá, '+u.name+'!</h1><div class="muted">Aqui estão os assuntos e atividades para acompanharmos juntos.</div></div><button class="btn dark" onclick="openAgenda(\''+u.name+'\')">✦ Preparar meu 1:1</button></div>'+quick(u.name)+'<div class="grid stats">'+stat('Em aberto',mine.filter(a=>a.status!=='Concluído').length)+stat('Atrasadas',mine.filter(a=>a.late).length)+stat('Aguardando Erika',mine.filter(a=>a.status==='Aguardando Erika').length)+stat('Concluídas',mine.filter(a=>a.status==='Concluído').length)+'</div><div class="sectionhead"><h2>Atividades em destaque</h2><span class="muted">'+mine.length+' itens</span></div><div class="grid activities">'+mine.map(card).join('')+'</div>'}
function activityView(){return '<div class="top"><div><h1>Atividades</h1><div class="muted">Acompanhe e atualize em poucos cliques.</div></div><input class="field search" id="search" placeholder="Pesquisar atividade" oninput="filterCards(this.value)"></div><div id="activityGrid" class="grid activities" style="margin-top:18px">'+visible().map(card).join('')+'</div>'}
function filterCards(q){const data=visible().filter(a=>a.title.toLowerCase().includes(q.toLowerCase()));document.getElementById('activityGrid').innerHTML=data.map(card).join('')||'<div class="card muted">Nenhuma atividade encontrada.</div>'}
function meetings(){const list=current.role==='manager'?users.slice(1):[current];return '<h1>Próximas reuniões</h1><p class="muted">Prepare a pauta automaticamente.</p><div class="grid activities">'+list.map(u=>'<button class="card" style="text-align:left" onclick="openAgenda(\''+u.name+'\')"><b>'+u.name+'</b><span class="muted" style="display:block">'+u.next+'</span><span style="float:right;color:var(--orange)">✦ Preparar pauta</span></button>').join('')+'</div>'}
function agenda(){const mine=activities.filter(a=>a.coord===agendaName&&a.status!=='Concluído'),groups=['Atividades atrasadas','Decisões necessárias','Riscos e impedimentos','Itens aguardando atuação','Pessoas, equipe e desenvolvimento'];return '<button class="back noPrint" onclick="agendaName=\'\';view=\'home\';render()">← Voltar</button><div class="agendahead"><div class="eyebrow">Pauta automática</div><h1>1:1 • Erika e '+agendaName+'</h1><p style="opacity:.7">Preparada em 1 de setembro de 2026 • '+mine.length+' assuntos em aberto</p><button class="btn small noPrint" onclick="copyAgenda()">Copiar pauta</button> <button class="btn outline small noPrint" onclick="print()">Imprimir / PDF</button></div>'+groups.map((g,i)=>'<section class="card agendaGroup"><h2>'+g+'</h2>'+mine.filter((a,n)=>n%4===i).map(a=>'<label class="agendaItem"><input type="checkbox"><span><b>'+esc(a.title)+'</b><small class="muted" style="display:block">'+a.owner+' • prazo '+a.due+'</small></span></label>').join('')+(i===4?'<textarea placeholder="Inclua temas adicionais, decisões e combinados..."></textarea>':'')+'</section>').join('')}
function copyAgenda(){const text='Pauta 1:1 — Erika e '+agendaName+'\n'+activities.filter(a=>a.coord===agendaName&&a.status!=='Concluído').map(a=>'• '+a.title).join('\n');navigator.clipboard?navigator.clipboard.writeText(text).then(()=>toast('Pauta copiada')):toast('Use Imprimir / PDF')}
function history(){return '<h1>Histórico</h1><p class="muted">Reuniões, decisões e alterações recentes.</p><div class="card" style="margin-top:18px">'+visible().slice(0,7).map((a,i)=>'<div class="historyItem"><span class="circle">✓</span><div><b>'+a.updated+'</b><div class="muted">'+esc(a.title)+' — '+(i%2?'comentário adicionado':'status atualizado para '+a.status)+'</div></div></div>').join('')+'</div>'}
function usersView(){return '<div class="top"><div><h1>Usuários</h1><div class="muted">Cadastre um novo coordenador com senha provisória.</div></div></div><div class="card settingsForm" style="max-width:720px;margin-top:22px"><label>Nome completo</label><input class="field" id="newUserName" autocomplete="name"><label>E-mail</label><input class="field" id="newUserEmail" type="email" autocomplete="email"><label>Senha provisória</label><input class="field" id="newUserPassword" type="password" autocomplete="new-password">'+passwordHint+'<label>Repita a senha provisória</label><input class="field" id="newUserPassword2" type="password" autocomplete="new-password"><div id="newUserMessage"></div><div class="settingsActions"><button class="btn" id="createUserButton" onclick="createManagedUser()">Criar usuário</button></div></div>'}
function showNewUserMessage(text,type){document.getElementById('newUserMessage').innerHTML=authMessage(text,type)}
function showManagedResetMessage(text,type){document.getElementById('managedResetMessage').innerHTML=authMessage(text,type)}
async function sendManagedPasswordReset(){if(current.role!=='manager')return;const email=document.getElementById('resetUserEmail').value.trim().toLowerCase();if(!email)return showManagedResetMessage('Informe ou selecione o e-mail do usuário.','error');const btn=document.getElementById('managedResetButton');btn.disabled=true;btn.textContent='Enviando...';try{const redirect=location.origin+location.pathname+'?recovery=1';const res=await fetch(SUPABASE_URL+'/auth/v1/recover?redirect_to='+encodeURIComponent(redirect),{method:'POST',headers:authHeaders(),body:JSON.stringify({email})}),data=await res.json().catch(()=>({}));if(!res.ok)throw new Error(data.msg||data.message||'Não foi possível enviar o link agora.');showManagedResetMessage('Link de redefinição enviado para '+email+'.','ok');document.getElementById('resetUserEmail').value=''}catch(e){showManagedResetMessage(e.message==='email rate limit exceeded'?'O limite temporário de e-mails foi atingido. Aguarde alguns minutos e tente novamente.':e.message,'error')}finally{btn.disabled=false;btn.textContent='Enviar link de redefinição'}}
async function createManagedUser(){if(current.role!=='manager')return;const name=document.getElementById('newUserName').value.trim(),email=document.getElementById('newUserEmail').value.trim().toLowerCase(),password=document.getElementById('newUserPassword').value,p2=document.getElementById('newUserPassword2').value,policy=passwordError(password);if(!name||!email||!password||!p2)return showNewUserMessage('Preencha todos os campos.','error');if(password!==p2)return showNewUserMessage('As senhas não coincidem.','error');if(policy)return showNewUserMessage(policy,'error');const btn=document.getElementById('createUserButton');btn.disabled=true;btn.textContent='Criando...';try{const username=email.split('@')[0],redirect=location.origin+location.pathname;const res=await fetch(SUPABASE_URL+'/auth/v1/signup?redirect_to='+encodeURIComponent(redirect),{method:'POST',headers:authHeaders(),body:JSON.stringify({email,password,data:{name,username,role:'coordinator',must_change_password:true}})}),data=await res.json();if(!res.ok)throw new Error(data.msg||data.message||'Não foi possível criar o usuário.');if(data.user?.id)await fetch(SUPABASE_URL+'/rest/v1/profiles?id=eq.'+data.user.id,{method:'PATCH',headers:{...authHeaders(currentSession.access_token),'Prefer':'return=minimal'},body:JSON.stringify({name,username,role:'coordinator',must_change_password:true})});loginDirectory[username]=email;if(!users.some(u=>u.username===username))users.push({name,username,role:'coordinator',next:'A definir'});showNewUserMessage('Usuário criado e ativado. Ele já pode acessar com a senha provisória e deverá alterá-la no primeiro login.','ok');['newUserName','newUserEmail','newUserPassword','newUserPassword2'].forEach(id=>document.getElementById(id).value='')}catch(e){showNewUserMessage(e.message,'error')}finally{btn.disabled=false;btn.textContent='Criar usuário'}}
function render(){renderNav();let html;if(view==='settings')html=settingsView();else if(view==='users')html=usersView();else if(view==='home')html=current.role==='manager'&&!space?managerHome():coordHome(space||current);else if(view==='activities')html=activityView();else if(view==='agenda')html=agendaName?agenda():meetings();else html=history();document.getElementById('content').innerHTML=html;window.scrollTo(0,0)}
const recoveryParams=new URLSearchParams(location.hash.slice(1)),recoveryQuery=new URLSearchParams(location.search);
if(recoveryParams.get('type')==='recovery'&&recoveryParams.get('access_token'))showAuth('recovery');
else if(recoveryQuery.get('recovery')==='1')showAuth('recovery','Este link não trouxe uma sessão válida. Solicite um novo link.');
else{const saved=sessionStorage.getItem('g11_session');if(saved){try{enterApp(JSON.parse(saved)).catch(()=>{sessionStorage.removeItem('g11_session');showAuth()})}catch(e){showAuth()}}else showAuth()}
</script>
</body></html>
